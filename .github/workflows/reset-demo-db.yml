# The live demo is public: anyone can sign in and add data. Every night, put the database back to the demo data.
name: Reset demo database

on:
  schedule:
    - cron: '0 3 * * *' # every night at 03:00 UTC
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency: reset-demo-db

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:reset:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
