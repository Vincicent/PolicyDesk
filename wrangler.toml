# Cloudflare Pages project config (read by `wrangler pages dev` and `wrangler pages deploy`).
name = "policydesk"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "policydesk"
# Local dev works with this placeholder. Before deploying, replace it with the id printed by `npx wrangler d1 create policydesk`.
database_id = "2455d7b5-f016-41af-a12c-e8f5a2b125aa"
migrations_dir = "migrations"
